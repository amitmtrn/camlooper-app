name: Build Cross-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
            name: 'windows-x64'
            script: 'build:windows:msvc'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
            name: 'linux-x64'
            script: 'build:linux'

    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
          pkg-config libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev \
          libswscale-dev libswresample-dev ffmpeg libclang-dev

    - name: Verify FFmpeg installation (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        pkg-config --modversion libavutil libavcodec libavformat
        ffmpeg -version

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install frontend dependencies
      run: npm ci

    - name: Build the app
      run: npm run ${{ matrix.script }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camlooper-${{ matrix.name }}
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/
        if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: CamLooper v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          camlooper-windows-x64/**
          camlooper-windows-x86/**
          camlooper-linux-x64/**
        generate_release_notes: true 