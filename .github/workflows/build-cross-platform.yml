name: Build Cross-Platform

# Builds native installers for every platform on its own runner (Tauri apps with
# native deps like FFmpeg / DirectShow / System Extensions cannot be cross-compiled).
#
#   - push a tag  v*      -> builds all platforms + attaches installers to a draft Release
#   - workflow_dispatch   -> builds all platforms (no Release) for smoke-testing
#   - PRs to main/master  -> Linux-only build sanity check
#
# Installers produced:
#   Windows  : .exe (NSIS) + .msi (WiX)
#   macOS    : .dmg  (aarch64 Apple Silicon on macos-14, x86_64 Intel on macos-13)
#   Linux    : .AppImage + .deb + .rpm

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'windows-x64'
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            name: 'macos-arm64'
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            name: 'macos-x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'linux-x64'
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
          pkg-config libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libavfilter-dev \
          libswscale-dev libswresample-dev ffmpeg libclang-dev

    - name: Install dependencies (macOS)
      if: startsWith(matrix.platform, 'macos')
      run: |
        brew install ffmpeg pkg-config

    - name: Verify FFmpeg installation (Linux/macOS)
      if: matrix.platform != 'windows-latest'
      run: |
        pkg-config --modversion libavutil libavcodec libavformat
        ffmpeg -version

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install frontend dependencies
      run: npm ci

    - name: Build app + installers and (on tag) publish to Release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ---- Code signing (currently unset; add these repo Secrets to sign) ----
        # macOS notarization + signing (REQUIRED for the virtual-camera System Extension):
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Windows signing (optional; add cert to remove SmartScreen warning):
        WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      with:
        # Only create/publish a Release when a v* tag was pushed; otherwise just build.
        tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('CamLooper {0}', github.ref_name) || '' }}
        releaseBody: 'See the assets below to download and install this version of CamLooper.'
        releaseDraft: true
        prerelease: false
        args: --target ${{ matrix.target }}

    - name: Upload build artifacts (non-tag runs)
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      uses: actions/upload-artifact@v4
      with:
        name: camlooper-${{ matrix.name }}
        # Only the finished installers — NOT the whole bundle/ dir, which on Linux
        # also contains the AppImage's extracted AppDir (hundreds of bundled .so libs).
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.AppImage
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.deb
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.rpm
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.dmg
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.exe
          src-tauri/target/${{ matrix.target }}/release/bundle/*/*.msi
        if-no-files-found: error
