name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-msvc
        override: true

    - name: Install dependencies
      run: npm install

    - name: Build Tauri app
      run: npm run build:windows:msvc

    - name: Upload Windows 64-bit artifact
      uses: actions/upload-artifact@v4
      with:
        name: camlooper-windows-x64
        path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/

  build-windows-32bit:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: i686-pc-windows-msvc
        override: true

    - name: Install dependencies
      run: npm install

    - name: Build Tauri app
      run: npm run build:windows:msvc:32

    - name: Upload Windows 32-bit artifact
      uses: actions/upload-artifact@v4
      with:
        name: camlooper-windows-x86
        path: src-tauri/target/i686-pc-windows-msvc/release/bundle/

  create-release:
    needs: [build-windows, build-windows-32bit]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Download Windows 64-bit artifact
      uses: actions/download-artifact@v4
      with:
        name: camlooper-windows-x64
        path: ./dist/windows-x64/

    - name: Download Windows 32-bit artifact
      uses: actions/download-artifact@v4
      with:
        name: camlooper-windows-x86
        path: ./dist/windows-x86/

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: CamLooper v${{ github.run_number }}
        draft: false
        prerelease: false

    - name: Upload Release Asset (Windows 64-bit)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/windows-x64/
        asset_name: camlooper-windows-x64.zip
        asset_content_type: application/zip

    - name: Upload Release Asset (Windows 32-bit)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/windows-x86/
        asset_name: camlooper-windows-x86.zip
        asset_content_type: application/zip 