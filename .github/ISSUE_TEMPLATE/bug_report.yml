name: Bug report
description: Something in CamLooper does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do **not** open an issue — see [SECURITY.md](https://github.com/amitmtrn/camlooper-app/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open CamLooper
        2. Load video X
        3. Start the virtual camera
        4. Open Zoom and select "CamLooper Virtual Camera"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CamLooper version
      description: Shown in the app, or the version of the installer you downloaded.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (.deb)
        - Linux (.rpm)
        - Linux (AppImage)
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version / distribution
      placeholder: "e.g. Ubuntu 25.04, Fedora 42, macOS 15.2"
  - type: input
    id: target-app
    attributes:
      label: Which app were you using the camera in?
      placeholder: "e.g. Zoom 6.2, OBS 31, Google Meet in Chrome"
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Anything the app printed, plus `dmesg | tail` if the virtual camera did not appear on Linux.
      render: shell
