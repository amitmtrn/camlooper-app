}

// The answer must keep the video m-line (port != 0) with at least one codec, and the
// transceiver must end up sending.
function videoAccepted(s, sdp) {
  const m = /^m=video (\d+) [^ ]+((?: \d+)*)\s*$/m.exec(sdp);
  if (!m || m[1] === "0" || !m[2].trim()) return false;
  const dir = s.videoTransceiver && s.videoTransceiver.currentDirection;
  return !dir || dir === "sendonly" || dir === "sendrecv";
}

async function addRemoteCandidate(s, d) {
  if (session !== s || !s.pc) return;
  let init;
  if (d.candidate && typeof d.candidate === "object") init = d.candidate;
  else if (typeof d.candidate === "string" && d.candidate) init = { candidate: d.candidate, sdpMid: d.sdpMid ?? null, sdpMLineIndex: d.sdpMLineIndex ?? null };
  else return; // end-of-candidates: nothing to do
  if (init.sdpMid == null && init.sdpMLineIndex == null) init.sdpMLineIndex = 0;
  await s.pc.addIceCandidate(init).catch((e) => dlog("addIceCandidate failed", e && e.name));
}

// Video codecs offered: what this phone can both send and (per spec validation) receive,
// limited to H.264 constrained baseline (42e01f / 42001f, packetization-mode=1), then VP8,
// plus rtx. Keeps the offer small (16 KB relay frame cap) and the desktop's job simple.
function pickVideoCodecs() {
  const caps = (C) => { try { return (C && C.getCapabilities && C.getCapabilities("video") || {}).codecs || []; } catch { return []; } };
  const send = caps(window.RTCRtpSender), recv = caps(window.RTCRtpReceiver);
  const key = (c) => `${c.mimeType.toLowerCase()}|${c.clockRate}|${(c.sdpFmtpLine || "").toLowerCase().split(";").map((x) => x.trim()).sort().join(";")}`;
  const sendKeys = new Set(send.map(key));
  const both = send.length ? recv.filter((c) => sendKeys.has(key(c))) : recv;
  const rank = (c) => {
    const mt = c.mimeType.toLowerCase(), f = (c.sdpFmtpLine || "").toLowerCase();
    if (mt === "video/h264") {
      if (!/packetization-mode=1/.test(f)) return -1;
      if (/profile-level-id=42e01f/.test(f)) return 0;
      if (/profile-level-id=42001f/.test(f)) return 1;
      return -1;
    }
    if (mt === "video/vp8") return 2;
    if (mt === "video/rtx") return 3;
    return -1;
  };
  const list = both.map((c, i) => [rank(c), i, c]).filter((x) => x[0] >= 0).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map((x) => x[2]);
  return list.some((c) => !/rtx/i.test(c.mimeType)) ? list : [];
}
function pickAudioCodecs() {
  try {
    const recv = (RTCRtpReceiver.getCapabilities && RTCRtpReceiver.getCapabilities("audio") || {}).codecs || [];
    return recv.filter((c) => /^audio\/opus$/i.test(c.mimeType));
  } catch { return []; }
}
const codecLabel = (list) => [...new Set(list.filter((c) => !/rtx/i.test(c.mimeType)).map((c) => c.mimeType.replace(/^video\//i, "").replace(/^h264$/i, "H.264")))].join(", ");

// ICE servers for a session (live and file use the same). null: the pair was revoked.
async function getIceServers() {
  try {
    const r = await api("GET", "/v1/ice-servers");
    dlog("ice-servers turn:", r && r.turn);
    return r && Array.isArray(r.iceServers) ? r.iceServers : [];
  } catch (e) {
    dlog("ice-servers failed", e.status, e.code);
    if (e.status === 401) return null;
    return [{ urls: ["stun:stun.cloudflare.com:3478", "stun:stun.l.google.com:19302"] }];
  }
}

// Candidate trickling and connection state, the same for live and file sessions.
function wirePeer(s, pc) {
  pc.onicecandidate = (ev) => {
    if (session !== s || s.ended) return;
    let data = null;
    if (ev.candidate && ev.candidate.candidate) data = { kind: "candidate", sessionId: s.id, candidate: ev.candidate.candidate, sdpMid: ev.candidate.sdpMid, sdpMLineIndex: ev.candidate.sdpMLineIndex };
    else if (!ev.candidate && !s.sentEoc) { s.sentEoc = true; data = { kind: "candidate", sessionId: s.id, candidate: "" }; }
    if (!data) return;
    if (s.offerSent) sendSignal(data); else s.localQueue.push(data); // never before the offer
  };
  pc.onconnectionstatechange = () => onPcState(s);
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") s.iceOk = true;
    onPcState(s);
  };
}

// Creates and sends the offer, then the candidates gathered meanwhile. false: the session ended.
async function sendOffer(s, pc) {
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  if (session !== s || s.ended) return false;
  sendSignal({ kind: "offer", sessionId: s.id, sdp: pc.localDescription.sdp });
  s.offerSent = true;
  for (const c of s.localQueue.splice(0)) sendSignal(c);
  return true;
}

async function connectPeer(s) {
  setChip("connecting"); setMsg("streamMsg", STRINGS.stConnecting);
  const iceServers = await getIceServers();
  if (!iceServers || session !== s || s.ended) return;

  const Q = QUALITY[s.quality] || QUALITY[720];
  const pc = new RTCPeerConnection({ iceServers, bundlePolicy: "max-bundle" });
  s.pc = pc;
  const vt = s.stream.getVideoTracks()[0];
  const at = s.stream.getAudioTracks()[0];
  const enc = { maxBitrate: Q.maxBitrate, maxFramerate: 30 };
  const vtx = pc.addTransceiver(vt, { direction: "sendonly", streams: [s.stream], sendEncodings: [enc] });
  s.videoSender = vtx.sender; s.videoTransceiver = vtx;
  let atx = null;
  if (at) { at.enabled = !micMuted; atx = pc.addTransceiver(at, { direction: "sendonly", streams: [s.stream] }); }
  const vcodecs = pickVideoCodecs();
  s.offeredCodecs = codecLabel(vcodecs) || "H.264, VP8";
  try { if (vcodecs.length && vtx.setCodecPreferences) vtx.setCodecPreferences(vcodecs); }
  catch (e) { dlog("setCodecPreferences(video) failed", e && e.name); }
  try { const ac = pickAudioCodecs(); if (atx && ac.length && atx.setCodecPreferences) atx.setCodecPreferences(ac); }
  catch (e) { dlog("setCodecPreferences(audio) failed", e && e.name); }

  wirePeer(s, pc);
  if (!(await sendOffer(s, pc))) return;
  await applySenderParams(s);

  clearInterval(s.timers.stats);
  s.timers.stats = setInterval(() => updateStats(s), 2000);
}

async function applySenderParams(s) {
  const sender = s.videoSender; if (!sender) return;
  const Q = QUALITY[s.quality] || QUALITY[720];
  try {
    const p = sender.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = Q.maxBitrate;
    p.encodings[0].maxFramerate = 30;
    p.degradationPreference = "maintain-framerate";
    await sender.setParameters(p);
  } catch (e) {
    dlog("setParameters failed, retrying without degradationPreference", e && e.name);
    try {
      const p = sender.getParameters();
      if (p.encodings && p.encodings[0]) { p.encodings[0].maxBitrate = Q.maxBitrate; p.encodings[0].maxFramerate = 30; }
      await sender.setParameters(p);
    } catch {}
  }
}

// Live / failure come from pc.connectionState only (ICE *and* DTLS). iceConnectionState is
// only used to tell a DTLS failure (ICE was fine) from a network failure.
function onPcState(s) {
  const pc = s.pc; if (!pc || session !== s || s.ended) return;
  const cs = pc.connectionState;
  dlog("pc", cs, "/ ice", pc.iceConnectionState);
  if (s.kind === "file") { onFilePcState(s, cs); return; }
  if (cs === "connected") {
    clearTimeout(s.timers.disc);
    if (!s.live) goLive(s); else if (s.record) { setChip("rec"); setMsg("streamMsg", STRINGS.recLive, "ok"); } else { setChip("live"); setMsg("streamMsg", STRINGS.stLive, "ok"); }
  } else if (cs === "failed") {
    if (!s.live && s.iceOk) endSession(STRINGS.errDtls, { failed: true, reason: "error" });
    else endSession(STRINGS.iceFailed, { failed: true, reason: "ice_failed" });
  } else if (s.live && cs === "disconnected") {
    // TODO(later): ICE restart (pc.restartIce() + re-offer) once the receiver supports it.
    setChip("reconnecting"); setMsg("streamMsg", STRINGS.stUnstable, "warn");
    clearTimeout(s.timers.disc);
    s.timers.disc = setTimeout(() => {
      if (session === s && !s.ended && s.pc && s.pc.connectionState !== "connected") endSession(STRINGS.iceFailed, { failed: true, reason: "ice_failed" });
    }, 20000);
  }
}

function goLive(s) {
  s.live = true; s.phase = "live";
  clearTimeout(s.timers.ice);
  s.startedAt = Date.now();
  if (s.record) { startTake(s); return; }
  setChip("live"); setMsg("streamMsg", STRINGS.stLive, "ok");
  show("stats");
  clearInterval(s.timers.clock);
  s.timers.clock = setInterval(() => { if (session === s && $("chip").classList.contains("live")) setChip("live"); }, 1000);
  updateStats(s);
}

// ---- Record a loop: the take ----
const takeElapsed = (s) => (s.takeAt ? Math.min(TAKE_CAP_MS, Date.now() - s.takeAt) : 0);

// The computer receives the camera: the take runs. The clock starts here and follows the
// computer's own count once it reports one (it starts saving a moment after the first frame).
function startTake(s) {
  s.takeAt = Date.now();
  const early = s.earlyTake, ms = early ? Number(early.record.elapsedMs) : NaN;
  if (early && early.record.phase === "recording" && ms >= 0 && ms <= TAKE_CAP_MS) s.takeAt = early.at - ms;
  setChip("rec"); setMsg("streamMsg", STRINGS.recLive, "ok");
  clearInterval(s.timers.clock);
  s.timers.clock = setInterval(() => {
    if (session !== s || s.ended) return;
    if (Date.now() - s.takeAt >= TAKE_CAP_MS) { stopTake(s); return; } // 1:00: stops on its own
    if ($("chip").classList.contains("rec")) setChip("rec");
  }, 250);
}

// `record` of a status signal during the take: { elapsedMs, capMs, phase, error? }.
function onTakeStatus(s, r) {
  if (!r || typeof r !== "object") return;
  const ms = Number(r.elapsedMs);
  if (r.phase === "recording" && ms >= 0 && ms <= TAKE_CAP_MS) { s.takeAt = Date.now() - ms; return; }
  // The computer ended the take itself (its Stop, or its own 60 s limit).
  if (r.phase === "processing") stopTake(s, { notify: false, force: true });
  else if (r.phase === "looping") { stopTake(s, { notify: false, quiet: true }); takeLooping(); }
  else if (r.phase === "failed") { stopTake(s, { notify: false, quiet: true }); endTake(takeError(r.error), "err"); }
}

// Stop (the button, 60 s, or the computer): the camera is released at once, and the home
// screen waits for the computer to say that the take loops.
// opts.notify false: the computer already knows. opts.quiet: the caller reports the outcome.
// opts.force: the computer said it is preparing the loop, whatever this page's clock says.
// opts.lapse: what to say, after opts.waitMs, when the computer never reports an outcome.
function stopTake(s, opts = {}) {
  if (session !== s || s.ended) return;
  const ms = takeElapsed(s);
  const id = s.id;
  endSession(null, { notify: opts.notify !== false, reason: "user", silent: true });
  showHome();
  clearTake();
  if (opts.quiet) return;
  // Shorter than the computer accepts: it drops the take, nothing will follow.
  if (ms < MIN_TAKE_MS && !opts.force) { setTakeMsg(opts.lapse || STRINGS.recTooShort, opts.lapse ? "" : "warn"); setTimeout(askLoopStatus, 1500); return; }
  take = { id, timer: setTimeout(() => { if (take && take.id === id) endTake(opts.lapse || STRINGS.recNoReply, opts.lapse ? "" : "warn"); }, opts.waitMs || TAKE_FINISH_MS) };
  setTakeMsg("");
  renderActions(); renderLoop();
  intoView("loopCard");
}

function clearTake() { if (take) clearTimeout(take.timer); take = null; }
function setTakeMsg(text, cls = "") { setMsg("takeMsg", text, cls); renderLoop(); }
// Human text from the computer is shown as it is (short, no control characters).
function takeError(text) { return cleanText(text, 160) || STRINGS.recIncomplete; }

// The take did not become a loop (or nobody said so): say why, then show what really plays.
function endTake(text, cls) {
  clearTake();
  setTakeMsg(text, cls);
  renderActions();
  intoView("loopCard");
  setTimeout(askLoopStatus, 1500);
}

function takeLooping() {
  clearTake();
  loop.known = true; loop.playing = true; loop.fromPhone = true;
  loop.pending = null; clearTimeout(loopTimer); setMsg("loopMsg", "");
  setTakeMsg(STRINGS.recLooping, "ok");
  renderActions();
  intoView("loopCard");
  setTimeout(askLoopStatus, 1500); // also brings the name the computer gave the take
}

// Signals that name a take which has stopped here and is being prepared on the computer.
function onTakeSignal(d) {
  dlog("<- signal (take)", d.kind);
  if (d.kind === "loop_status") { if (d.playing === true && d.fromPhone === true && !d.error) takeLooping(); return; }
  if (d.kind !== "status" || !d.record || typeof d.record !== "object") return;
  if (d.record.phase === "looping") takeLooping();
  else if (d.record.phase === "failed") endTake(takeError(d.record.error), "err");
}

// stream_stop for a take, from the computer. "done": it loops.
function onTakeStop(reason) {
  if (reason === "done" || reason === "finished") { takeLooping(); return; }
  if (reason === "too_short") { endTake(STRINGS.recTooShort, "warn"); return; }
  if (reason === "incomplete") { endTake(STRINGS.recIncomplete, "err"); return; }
  // The echo of this phone's own stop: the result is still to come.
  if (reason === "user" || reason === "cancelled") return;
  endTake(reason === "ice_failed" ? STRINGS.iceFailed : own(STRINGS.recStopped, reason) || STRINGS.recStopped.other, "err");
}

function onRemoteStop(data) {
  const s = session;
  if (take && data.sessionId === take.id) { dlog("<- stream_stop (take)", data.reason); onTakeStop(typeof data.reason === "string" ? data.reason : "other"); return; }
  if (!s || s.ended) return;
  // Without a sessionId, a stop can only be meant for a request the desktop hasn't answered
  // yet; once accepted it must name this session (a stale stop must not end a new one).
  if (data.sessionId ? data.sessionId !== s.id : s.phase !== "requesting") { dlog("ignoring stream_stop for other session"); return; }
  dlog("<- stream_stop", data.reason);
  const reason = typeof data.reason === "string" ? data.reason : "other";
  if (s.kind === "file") { onFileRemoteStop(s, reason); return; }
  if (s.record && s.live) {
    // The computer's own Cancel / Stop: a take that is long enough still becomes the loop,
    // so wait a little for that news before calling it cancelled.
    if (reason === "user" || reason === "cancelled") stopTake(s, { notify: false, waitMs: 15000, lapse: STRINGS.recCancelledDesk });
    else { stopTake(s, { notify: false, quiet: true }); onTakeStop(reason); }
    return;
  }
  const msg = reason === "ice_failed" ? STRINGS.iceFailed : (own(STRINGS.stopped, reason) || STRINGS.stopped.other);
  endSession(null, { notify: false, silent: true });
  showHome(msg, reason === "user" ? "" : "warn");
}

// Ends the current session. opts.failed: stay on the stream screen with a Failed chip.
function endSession(message, opts = {}) {
  const s = session;
  if (!s) return;
  if (s.kind === "file") { endFileSession(s, message, opts); return; }
  if (!s.ended) {
    s.ended = true;
    const notify = opts.notify !== undefined ? opts.notify : opts.reason !== undefined;
    if (notify) sendStop(s.id, opts.reason || "user");
    if (s.phase !== "camera") lastLiveEndAt = Date.now(); // the computer knew about this session
    for (const k in s.timers) { clearTimeout(s.timers[k]); clearInterval(s.timers[k]); }
    if (s.pc) { try { s.pc.close(); } catch {} }
    if (s.stream) s.stream.getTracks().forEach((t) => t.stop());
    releaseWake();
    outbox = [];
  }
  $("preview").srcObject = null;
  show("hiddenNote", false);
  session = null;
  $("micNote").textContent = "";
  if (opts.failed && !opts.silent) {
    setChip("failed");
    setMsg("streamMsg", "");
    banner("streamFail", message || STRINGS.errGeneric, "err");
    show("streamActions", false); show("failActions"); show("keepOpen", false);
  }
  // A hello that could not be sent during the session, or went unanswered before it.
  if (!hello.ok && desk.online) sayHello();
}

// Switch camera mid-stream (replaceTrack, no renegotiation)
$("btnSwitch").onclick = async () => {
  const s = session; if (!s || s.ended || !s.stream || s.switching || s.record) return;
  s.switching = true; $("btnSwitch").disabled = true;
  try { await switchCamera(s); }
  finally {
    s.switching = false;
    if (session === s && !s.ended) $("btnSwitch").disabled = false;
  }
};

async function switchCamera(s) {
  const next = s.facing === "user" ? "environment" : "user";
  const alive = () => session === s && !s.ended;
  let nt = null;
  try { nt = await openVideoTrack(next, s.quality, true); }
  catch (e) {
    dlog("switch: open failed", e && e.name);
    if (!alive()) return;
    if (e && e.name === "OverconstrainedError") { setMsg("streamMsg", STRINGS.errNoOtherCam, "warn"); return; } // keep the current camera
    // Many Android phones can't open two cameras at once: release the current one first.
    const old = s.stream.getVideoTracks()[0];
    if (old) old.stop();
    try { nt = await openVideoTrack(next, s.quality, true); }
    catch (e2) {
      dlog("switch: retry failed", e2 && e2.name);
      if (!alive()) return;
      // Reopen the camera we had; if that fails too the session can't continue.
      let back = null;
      try { back = await openVideoTrack(s.facing, s.quality, false); } catch (e3) { dlog("switch: reopen failed", e3 && e3.name); }
      if (!alive()) { if (back) back.stop(); return; }
      if (!back || !(await swapTrack(s, back, s.facing))) endSession(STRINGS.errCam, { failed: true, reason: "error" });
      return;
    }
  }
  if (!alive()) { nt.stop(); return; }
  if (await swapTrack(s, nt, next)) return;
  // replaceTrack failed: fine if the old track still runs, fatal if it was released.
  const cur = s.stream && s.stream.getVideoTracks()[0];
  if (alive() && (!cur || cur.readyState !== "live")) endSession(STRINGS.errCam, { failed: true, reason: "error" });
}

// Puts nt on the sender, then (only on success) retires the old track and flips UI state.
// Stops nt and returns false on failure.
async function swapTrack(s, nt, face) {
  try { nt.contentHint = "motion"; } catch {}
  if (s.videoSender) {
    try { await s.videoSender.replaceTrack(nt); }
    catch (e) { dlog("replaceTrack failed", e && e.name); nt.stop(); return false; }
  }
  if (session !== s || s.ended) { nt.stop(); return false; }
  for (const old of s.stream.getVideoTracks()) { old.onended = null; s.stream.removeTrack(old); old.stop(); }
  s.stream.addTrack(nt);
  watchTrack(s, nt);
  s.facing = face; facing = face;
  for (const x of $("segFacing").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x.dataset.v === face));
  setPreview(s.stream, face);
  return true;
}

// Stats every 2 s
async function updateStats(s) {
  const pc = s.pc; if (!pc || session !== s || s.ended) return;
  let report; try { report = await pc.getStats(); } catch { return; }
  const byId = new Map(); report.forEach((x) => byId.set(x.id, x));
  let out = null, sel = null;
  report.forEach((x) => {
    if (x.type === "outbound-rtp" && x.kind === "video" && (!out || (x.bytesSent || 0) > (out.bytesSent || 0))) out = x;
    if (x.type === "transport" && x.selectedCandidatePairId) sel = byId.get(x.selectedCandidatePairId) || sel;
  });
  if (!sel) report.forEach((x) => { if (!sel && x.type === "candidate-pair" && (x.selected || (x.nominated && x.state === "succeeded"))) sel = x; });
  if (out) {
    $("stRes").textContent = out.frameWidth ? `${out.frameWidth}×${out.frameHeight}` : "–";
    $("stFps").textContent = out.framesPerSecond != null ? `${Math.round(out.framesPerSecond)} fps` : "–";
    const p = s.prevStats;
    if (p && out.timestamp > p.ts) $("stRate").textContent = `${Math.round(((out.bytesSent - p.bytes) * 8) / (out.timestamp - p.ts))} kbps`;
    s.prevStats = { bytes: out.bytesSent, ts: out.timestamp };
    const codec = out.codecId && byId.get(out.codecId);
    $("stCodec").textContent = codec ? codec.mimeType.replace(/^video\//i, "") : "–";
  }
  if (sel) {
    const lc = byId.get(sel.localCandidateId), rc = byId.get(sel.remoteCandidateId);
    const name = (t) => ({ host: STRINGS.pathHost, srflx: STRINGS.pathSrflx, prflx: STRINGS.pathPrflx, relay: STRINGS.pathRelay }[t] || t || "?");
    const relayed = (lc && lc.candidateType === "relay") || (rc && rc.candidateType === "relay");
    $("stPath").textContent = `${relayed ? STRINGS.pathRelay : name(lc && lc.candidateType)} · ${lc ? lc.candidateType : "?"}/${rc ? rc.candidateType : "?"}`;
    $("stRtt").textContent = sel.currentRoundTripTime != null ? `${Math.round(sel.currentRoundTripTime * 1000)} ms` : "–";
  }
}

// ---------------------------------------------------------------------------------
// Loop a video: one file goes to the computer over a WebRTC DataChannel ("camlooper-file"),
// the computer saves it and plays it on repeat as its camera. Same signaling as a live
// session (stream_request mode "file" → accept → offer/answer/candidates), no media tracks.
// ---------------------------------------------------------------------------------
const mb = (bytes) => { const v = Math.max(0, Number(bytes) || 0) / 1048576; return v > 0 && v < 0.1 ? "0.1" : v.toFixed(1); };
const cleanText = (v, max) => Array.from(String(v == null ? "" : v).replace(/[\u0000-\u001f\u007f-\u009f]/g, " ").trim()).slice(0, max).join("");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const intoView = (id) => { try { $(id).scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch {} };
const fileSession = () => (session && !session.ended && session.kind === "file" ? session : null);

// What the computer is told about the file. The name is for display only: no control
// characters, at most 120 characters (the extension survives the cut). The same values go
// into the request and into the "meta" message, which the computer compares.
function fileMeta(file) {
  let name = String(file.name || "").replace(/[\u0000-\u001f\u007f-\u009f]/g, "").trim();
  const dot = name.lastIndexOf(".");
  const ext = dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
  const chars = Array.from(name);
  if (chars.length > 120) {
    const tail = dot > 0 && name.length - dot <= 10 ? Array.from(name.slice(dot)) : [];
    name = chars.slice(0, 120 - tail.length).join("").trim() + tail.join("");
  }
  if (!name) name = "video";
  // Android often reports no type at all (or a generic one) for .mov / .mkv: then the
  // extension decides, and the computer is told the type that goes with it.
  const type = String(file.type || "").trim().toLowerCase().slice(0, 100);
  const known = own(FILE_EXT_MIME, ext);
  const isVideo = /^video\/./.test(type);
  return { ok: isVideo || !!known, meta: { name, size: Number(file.size) || 0, mime: isVideo ? type : known || type } };
}

$("btnPick").onclick = () => { const input = $("fileInput"); input.value = ""; input.click(); };
$("fileInput").onchange = () => {
  const f = $("fileInput").files && $("fileInput").files[0];
  if (!f) return; // picker dismissed: keep what was chosen before
  const m = fileMeta(f), size = m.meta.size;
  let err = "";
  if (!m.ok) err = STRINGS.fileNotVideo;
  else if (!(size > 0)) err = STRINGS.fileEmpty; // also a WebView that hands over a file it cannot size
  else if (size > MAX_FILE_BYTES) err = STRINGS.fileTooLarge(mb(size));
  picked = { file: f, meta: m.meta, err };
  renderFile();
  setMsg("fileMsg", err, "err");
};
$("btnSend").onclick = () => { startFileSend().catch((e) => { dlog("file send failed to start", e && e.name); if (fileSession()) endSession(STRINGS.errGeneric, { failed: true, reason: "error" }); }); };
$("btnXferCancel").onclick = () => { if (fileSession()) endSession(STRINGS.fileCancelled, { notify: true, reason: "user", neutral: true }); };

// The "Loop a video" card: picker, or the transfer in progress, plus the loop controls.
function renderFile() {
  const s = fileSession();
  show("filePick", !s); show("fileXfer", !!s);
  renderActions(); // one session at a time
  show("fileInfo", !!picked);
  $("fileName").textContent = picked ? picked.meta.name : "";
  $("fileSize").textContent = picked ? STRINGS.fileSize(mb(picked.meta.size)) : "";
  show("btnSend", !!picked && !picked.err);
  $("btnPick").textContent = picked ? STRINGS.chooseOther : STRINGS.chooseVideo;
  $("btnPick").className = "block " + (picked && !picked.err ? "link" : "secondary");
  if (s) renderXfer(s);
  renderLoop();
}

function renderXfer(s) {
  if (session !== s) return;
  const size = s.meta.size, confirmed = Math.min(s.confirmed, size), sent = Math.min(s.sent, size);
  $("xferName").textContent = s.meta.name;
  $("xferSize").textContent = STRINGS.fileSize(mb(size));
  const text = own({ stopping: STRINGS.fileStoppingLive, requesting: STRINGS.stWaitAccept, connecting: STRINGS.stConnecting, sending: STRINGS.fileSending, preparing: STRINGS.filePreparing, looping: STRINGS.fileLooping }, s.stage) || "";
  setMsg("xferMsg", text, s.stage === "looping" ? "ok" : "");
  show("xferProg", s.stage === "sending" || s.stage === "preparing");
  // The percentage is what the computer has confirmed, not what left this phone.
  const pct = confirmed >= size ? 100 : Math.min(99, Math.floor((confirmed / size) * 100));
  $("xferPct").textContent = `${pct} %`;
  $("xferBar").setAttribute("aria-valuenow", String(pct));
  $("xferBarSent").style.width = `${(sent / size) * 100}%`;
  $("xferBarDone").style.width = `${(confirmed / size) * 100}%`;
  $("xferNums").textContent = STRINGS.fileNums(mb(sent), mb(confirmed), mb(size));
  show("xferKeep", s.stage !== "looping" && s.stage !== "preparing");
  show("btnXferCancel", s.stage !== "looping");
}

async function startFileSend() {
  if (!picked || picked.err || fileSession()) return;
  const fail = (text) => setMsg("fileMsg", text, "err");
  setMsg("fileMsg", "");
  if (!window.RTCPeerConnection) { fail(STRINGS.fileNoRtc); return; }
  if (!ws || ws.readyState !== 1) { fail(wsReplaced ? STRINGS.errReplaced : STRINGS.errNotConnected); if (!ws && !wsReplaced) connectWs(); return; }
  if (desk.known && !desk.online) { fail(STRINGS.errDeskOffline); return; }
  if (desk.protocol && desk.protocol < 2) { fail(STRINGS.errDeskOld); return; }
  // One session at a time: a running camera stream is stopped first (the normal stop path).
  if (session && !session.ended) { endSession(null, { notify: true, reason: "user" }); showHome(); }

  const s = session = {
    kind: "file", id: randomId(), file: picked.file, meta: picked.meta, pc: null, dc: null, live: false, ended: false,
    timers: {}, pendingRemote: [], localQueue: [], offerSent: false, iceOk: false,
    phase: "waiting", stage: "requesting", sent: 0, confirmed: 0, sentAll: false, done: false,
    // The computer answers "busy" until it has let go of a camera stream that just ended.
    busyUntil: lastLiveEndAt ? lastLiveEndAt + BUSY_RETRY_WINDOW_MS : 0,
  };
  outbox = [];
  renderFile();
  intoView("fileXfer");
  keepAwake();
  const settle = lastLiveEndAt + LIVE_SETTLE_MS - Date.now();
  if (settle > 0) {
    s.stage = "stopping"; renderXfer(s);
    await sleep(settle);
    if (session !== s || s.ended) return;
  }
  requestFile(s);
}

function requestFile(s) {
  s.phase = "requesting"; s.stage = "requesting"; renderXfer(s);
  expectLoopStatus(s.id); // the computer reports its loop under this id when the session ends
  sendSignal({ kind: "stream_request", sessionId: s.id, deviceLabel: (pair && pair.deviceName) || defaultDeviceName(), mode: "file", file: s.meta });
  clearTimeout(s.timers.accept);
  s.timers.accept = setTimeout(() => {
    if (session === s && s.phase === "requesting") endSession(STRINGS.acceptTimeout, { failed: true, reason: "timeout" });
  }, ACCEPT_TIMEOUT_MS);
}

function onFileReject(s, reason) {
  if (reason === "busy" && Date.now() < s.busyUntil) {
    // Still tearing down the camera stream this phone just stopped: ask again, as a new request.
    dlog("file request: computer busy, retrying");
    s.phase = "waiting"; s.stage = "stopping"; renderXfer(s);
    s.timers.retry = setTimeout(() => { if (session !== s || s.ended) return; s.id = randomId(); outbox = []; requestFile(s); }, BUSY_RETRY_MS);
    return;
  }
  endSession(own(STRINGS.fileReject, reason) || STRINGS.fileReject.other, { failed: true, notify: false });
}

async function connectFilePeer(s) {
  s.stage = "connecting"; renderXfer(s);
  const iceServers = await getIceServers();
  if (!iceServers || session !== s || s.ended) return;
  const pc = new RTCPeerConnection({ iceServers, bundlePolicy: "max-bundle" });
  s.pc = pc;
  const dc = pc.createDataChannel("camlooper-file", { ordered: true });
  dc.binaryType = "arraybuffer";
  dc.bufferedAmountLowThreshold = BUF_LOW;
  s.dc = dc;
  const failed = (e) => {
    dlog("file send failed", e && e.name);
    if (session === s && !s.ended) endSession(e && e.name === "FileReadError" ? STRINGS.fileRead : STRINGS.fileLost, { failed: true, reason: "error" });
  };
  dc.onopen = () => { if (session === s && !s.ended && !s.live) pumpFile(s).catch(failed); };
  dc.onmessage = (ev) => { if (typeof ev.data === "string") onFileMessage(s, ev.data); };
  // A channel that closes by itself: the computer's own stop or error message says why and
  // normally arrives first; give it a moment before calling it a lost connection.
  dc.onclose = () => {
    if (session !== s || s.ended) return;
    clearTimeout(s.timers.closed);
    s.timers.closed = setTimeout(() => {
      if (session !== s || s.ended) return;
      if (s.done) finishFile(s, false); else endSession(STRINGS.fileLost, { failed: true, reason: "error" });
    }, 1500);
  };
  wirePeer(s, pc);
  await sendOffer(s, pc);
}

function onFilePcState(s, cs) {
  if (cs === "connected") { clearTimeout(s.timers.disc); return; }
  const lost = () => {
    if (s.done) finishFile(s, false); // the video already loops: losing the connection now is fine
    else if (s.live) endSession(STRINGS.fileLost, { failed: true, reason: "error" });
    else if (s.iceOk) endSession(STRINGS.errDtls, { failed: true, reason: "error" });
    else endSession(STRINGS.iceFailed, { failed: true, reason: "ice_failed" });
  };
  if (cs === "failed") lost();
  else if (cs === "disconnected" && s.live) {
    clearTimeout(s.timers.disc);
    s.timers.disc = setTimeout(() => { if (session === s && !s.ended && s.pc && s.pc.connectionState !== "connected") lost(); }, 20000);
  }
}

// Resolves once the channel has drained to the low mark (or can no longer send).
function drained(s, dc) {
  return new Promise((resolve) => {
    const done = () => { dc.removeEventListener("bufferedamountlow", done); clearInterval(poll); resolve(); };
    // The event is the normal path; the poll covers a missed event and a closed channel.
    const poll = setInterval(() => { if (session !== s || s.ended || dc.readyState !== "open" || dc.bufferedAmount <= BUF_LOW) done(); }, 250);
    dc.addEventListener("bufferedamountlow", done);
  });
}

// meta, the file in pieces of at most 64 KiB (never more than 4 MiB waiting in the channel), end.
async function pumpFile(s) {
  const dc = s.dc, file = s.file, size = s.meta.size;
  s.live = true; s.phase = "sending"; s.stage = "sending";
  clearTimeout(s.timers.ice);
  renderXfer(s);
  // Never larger than the computer says it takes (it answers 64 KiB) — also when that is
  // less than a "sensible" minimum: a piece over the limit makes send() throw.
  const max = s.pc && s.pc.sctp && s.pc.sctp.maxMessageSize > 0 ? s.pc.sctp.maxMessageSize : FILE_CHUNK;
  const chunk = Math.max(1, Math.floor(Math.min(FILE_CHUNK, max)));
  const alive = () => session === s && !s.ended;
  dc.send(JSON.stringify({ t: "meta", name: s.meta.name, size, mime: s.meta.mime }));
  let offset = 0, shown = 0;
  while (offset < size) {
    if (!alive()) return;
    if (dc.readyState !== "open") throw new Error("channel closed");
    if (dc.bufferedAmount > BUF_HIGH) { await drained(s, dc); continue; }
    let buf;
    try { buf = await file.slice(offset, Math.min(size, offset + chunk)).arrayBuffer(); }
    catch (e) { dlog("file read failed", e && e.name); const err = new Error("read"); err.name = "FileReadError"; throw err; }
    if (!alive()) return;
    if (!buf.byteLength) { const err = new Error("short read"); err.name = "FileReadError"; throw err; } // the file changed under us
    if (dc.readyState !== "open") throw new Error("channel closed");
    dc.send(buf);
    offset += buf.byteLength; s.sent = offset;
    const now = Date.now();
    if (now - shown > 100) { shown = now; renderXfer(s); }
  }
  dc.send('{"t":"end"}');
  s.sentAll = true;
  renderXfer(s);
}

// Text messages from the computer on the channel.
function onFileMessage(s, text) {
  if (session !== s || s.ended) return;
  let m; try { m = JSON.parse(text); } catch { return; }
  if (!m || typeof m !== "object") return;
  dlog("<- file", m.t);
  switch (m.t) {
    case "progress": {
      const n = Number(m.received);
      if (n >= 0) s.confirmed = Math.max(s.confirmed, Math.min(s.meta.size, n));
      break;
    }
    case "saved":
      s.confirmed = s.meta.size; s.stage = "preparing";
      break;
    case "processing":
      s.stage = "preparing";
      break;
    case "looping":
      // Success. The computer ends the session itself (stream_stop "done"); wait for that
      // rather than closing under it, but not forever.
      s.done = true; s.stage = "looping"; s.confirmed = s.meta.size;
      s.loopName = cleanText(m.name, 120) || s.meta.name;
      clearTimeout(s.timers.finish);
      s.timers.finish = setTimeout(() => { if (session === s && !s.ended) finishFile(s, true); }, FINISH_WAIT_MS);
      break;
    case "error":
      endSession(STRINGS.fileDeskError(cleanText(m.message, 160)), { failed: true, notify: false });
      return;
    default: return;
  }
  renderXfer(s);
}

function onFileRemoteStop(s, reason) {
  // Success is what the computer said on the data channel ("looping"), which only the
  // computer can write to. A stream_stop "done" arrives through the relay: on its own it
  // ends the session, but it is not taken as proof that the video loops.
  if (s.done) { finishFile(s, false); return; }
  if ((reason === "done" || reason === "finished") && s.sentAll) {
    // Probably fine, but unconfirmed: say so, and let the loop_status that follows (or the
    // one asked for in a moment) show what the computer is really playing.
    endSession(STRINGS.fileUnconfirmed, { neutral: true, notify: false });
    return;
  }
  const msg = reason === "ice_failed" ? STRINGS.iceFailed : own(STRINGS.fileStopped, reason) || STRINGS.fileStopped.other;
  endSession(msg, { failed: true, notify: false });
}

// The video loops on the computer: close up, show the loop controls.
function finishFile(s, notify) {
  loop.known = true; loop.playing = true; loop.fromPhone = true; loop.name = s.loopName || s.meta.name;
  loop.pending = null; clearTimeout(loopTimer); setMsg("loopMsg", "");
  if (picked && picked.file === s.file) picked = null;
  endSession(STRINGS.fileLooping, { ok: true, notify, reason: "done" });
}

function endFileSession(s, message, opts) {
  if (!s.ended) {
    s.ended = true;
    const notify = opts.notify !== undefined ? opts.notify : opts.reason !== undefined;
    if (notify) sendStop(s.id, opts.reason || "user");
    for (const k in s.timers) { clearTimeout(s.timers[k]); clearInterval(s.timers[k]); }
    if (s.dc) { s.dc.onopen = s.dc.onmessage = s.dc.onclose = null; try { s.dc.close(); } catch {} }
    if (s.pc) { try { s.pc.close(); } catch {} }
    releaseWake();
    outbox = [];
  }
  if (session === s) session = null;
  renderFile();
  if (opts.silent) return;
  setMsg("fileMsg", message || (opts.ok ? "" : STRINGS.errGeneric), opts.ok ? "ok" : opts.neutral ? "" : "err");
  intoView("loopCard"); // the card is below the camera controls: keep the outcome on screen
  // A transfer that stopped half-way may or may not have touched the loop: ask.
  if (!opts.ok) setTimeout(askLoopStatus, 1500);
}

// ---- Loop controls (loop_control → loop_status) ----
// Ids of the loop_control requests (and file sessions) whose loop_status is still wanted.
const loopAsked = [];
function expectLoopStatus(id) { loopAsked.push(id); if (loopAsked.length > 16) loopAsked.shift(); }
function sendLoopControl(action) {
  dlog("-> signal loop_control", action);
  const id = randomId();
  if (!wsSend({ type: "signal", data: { kind: "loop_control", sessionId: id, action } })) return false;
  expectLoopStatus(id);
  return true;
}
// Asked whenever the computer is (again) known to be online; never during a session,
// which the computer answers with an error.
function askLoopStatus() {
  if (!pair || !pair.linked || !desk.known || !desk.online || (desk.protocol && desk.protocol < 2)) return;
  if ((session && !session.ended) || take) return;
  sendLoopControl("status");
}
function onLoopStatus(d) {
  // Only an answer to something this page asked: an unsolicited loop_status is not applied.
  if (typeof d.sessionId !== "string" || !loopAsked.includes(d.sessionId)) { dlog("ignoring unsolicited loop_status"); return; }
  dlog("<- signal loop_status", { playing: d.playing, fromPhone: d.fromPhone, error: !!d.error });
  const acted = loop.pending;
  loop.pending = null; clearTimeout(loopTimer);
  loop.known = true; loop.playing = d.playing === true; loop.fromPhone = d.fromPhone === true;
  loop.name = typeof d.name === "string" ? cleanText(d.name, 120) : "";
  renderLoop();
  const failed = acted && typeof d.error === "string" && d.error;
  setMsg("loopMsg", failed ? (own(STRINGS.loopErrors, d.error) || STRINGS.loopFailed) : "", "err");
}
function renderLoop() {
  const has = loop.known && (loop.playing || !!loop.name) && !fileSession() && !take;
  show("loopNow", has);
  show("takeBusy", !!take);
  show("loopAway", loop.playing);
  show("loopCard", has || !!take || !!$("takeMsg").textContent);
  $("loopDot").className = "dot" + (loop.playing ? " on" : "");
  $("loopNowState").textContent = loop.playing ? STRINGS.loopPlaying : STRINGS.loopStopped;
  $("loopNowName").textContent = loop.name;
  const b = $("btnLoopToggle");
  b.textContent = loop.playing ? STRINGS.stopLoop : STRINGS.playLoop;
  b.className = "block" + (loop.playing ? " secondary" : "");
  b.disabled = !!loop.pending;
}
$("btnLoopToggle").onclick = () => {
  if (loop.pending) return;
  const action = loop.playing ? "stop" : "start";
  if (!sendLoopControl(action)) { setMsg("loopMsg", wsReplaced ? STRINGS.errReplaced : STRINGS.errNotConnected, "err"); if (!ws && !wsReplaced) connectWs(); return; }
  setMsg("loopMsg", "");
  loop.pending = action; renderLoop();
  clearTimeout(loopTimer);
  loopTimer = setTimeout(() => { loop.pending = null; renderLoop(); setMsg("loopMsg", STRINGS.loopNoReply, "err"); }, LOOP_REPLY_MS);
};

// ---------------------------------------------------------------------------------
// Wake lock + visibility
// ---------------------------------------------------------------------------------
async function keepAwake() {
  if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
  try {
    const lock = await navigator.wakeLock.request("screen");
    if (!session || session.ended) { lock.release().catch(() => {}); return; }
    wakeLock = lock;
    lock.addEventListener("release", () => { if (wakeLock === lock) wakeLock = null; });
  } catch (e) { dlog("wake lock failed", e && e.name); }
}
function releaseWake() { const l = wakeLock; wakeLock = null; if (l) l.release().catch(() => {}); }

document.addEventListener("visibilitychange", () => {
  const streaming = session && !session.ended;
  if (document.visibilityState === "visible") {
    show("hiddenNote", false);
    if (streaming) {
      keepAwake();
      const vt = session.stream && session.stream.getVideoTracks()[0];
      if (vt && vt.readyState === "ended") onVideoEnded(session, vt);
    }
    if (pair && !ws && !wsStopped && !wsReplaced) { wsAttempt = 0; connectWs(); }
    else if (hello.state === "old" && desk.known && desk.online) sayHello(); // updated meanwhile?
  } else if (streaming) {
    show("hiddenNote");
  }
});
window.addEventListener("online", () => { if (pair && !ws && !wsReplaced) { wsAttempt = 0; connectWs(); } });
window.addEventListener("pagehide", () => {
  if (session && !session.ended) sendStop(session.id, "user");
});

// ---------------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------------
if (!pair) {
  showPairStart();
} else if (!pair.linked) {
  showPairCode(); // shows "expired" + "Get a new code" if the saved code ran out
  connectWs();
} else {
  showHome();
  connectWs();
}
</script>
</body>
