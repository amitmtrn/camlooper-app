[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
ar = "i686-w64-mingw32-ar"

# MSVC targets are built via cargo-xwin (`tauri build --runner cargo-xwin --target
# x86_64-pc-windows-msvc`), which injects lld-link + the Windows CRT/SDK lib paths itself.
# Do NOT set linker/rustflags for the msvc targets here — a static `linker = "lld"` conflicts
# with cargo-xwin and breaks the link.

[env]
# Set the resource compiler for Windows builds
RC_x86_64_pc_windows_gnu = "x86_64-w64-mingw32-windres"
RC_i686_pc_windows_gnu = "i686-w64-mingw32-windres"
RC_x86_64_pc_windows_msvc = "llvm-rc"
RC_i686_pc_windows_msvc = "llvm-rc"
RC_aarch64_pc_windows_msvc = "llvm-rc" 