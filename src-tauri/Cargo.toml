[package]
name = "camlooper"
version = "0.2.2"
description = "Turn any video into a virtual camera for Zoom, Teams, Meet, OBS and Discord"
authors = ["Amit <amit7000@gmail.com>"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/amitmtrn/camlooper-app"
homepage = "https://camlooper.com"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "camlooper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
once_cell = "1"
bytes = "1"
image = "0.25"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tempfile = "3.0"

# FFmpeg - conditional compilation for different platforms
# On Windows, use a different implementation to avoid cross-compilation issues
[target.'cfg(not(windows))'.dependencies]
ffmpeg-next = "8.0"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation", 
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "implement"
] }
widestring = "1.0"
mp4 = "0.14.0"  # Pure Rust MP4 library for Windows video processing
cc = "1.0"  # For building C code (softcam integration)
# virtualcam-rs = { git = "https://github.com/itisl2220/virtualcam-rs" }  # TODO: Re-enable when API is documented
# For Windows builds, we'll use a simpler implementation without FFmpeg
# This avoids cross-compilation issues with native libraries

# Platform-specific dependencies for virtual camera
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
image = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"

