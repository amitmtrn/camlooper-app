[package]
name = "camlooper"
version = "0.2.4"
description = "Turn any video into a virtual camera for Zoom, Teams, Meet, OBS and Discord"
authors = ["Amit <amit7000@gmail.com>"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/amitmtrn/camlooper-app"
homepage = "https://camlooper.com"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "camlooper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles macos/camera_bridge.m. Only used when the target is macOS (see build.rs).
cc = "1"

[dependencies]
# No "devtools" feature: every devtools API is already gated on
# `cfg(any(debug_assertions, feature = "devtools"))`, so `tauri dev` keeps its
# inspector either way. Naming the feature here is what forced it into release
# builds as well.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Phone remote (src/remote, src/tray.rs). The two plugins are pinned with "=" because
# their newer releases require tauri >= 2.8 / 2.12 while this repo locks tauri 2.6.2;
# a caret range would let `cargo update` silently pull a tauri bump. Revisit when tauri
# itself is bumped.
tauri-plugin-autostart = "=2.5.0"
tauri-plugin-single-instance = "=2.3.0"
# Networking for the phone remote must be pure Rust: the Windows build is cross-compiled
# from Linux with cargo-xwin, so OpenSSL/native-tls and aws-lc-rs (cmake + nasm) are out.
# ring is the rustls crypto provider on every target.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
once_cell = "1"
memchr = "2"
bytes = "1"
image = "0.25"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
tempfile = "3.0"

# FFmpeg - conditional compilation for different platforms
# On Windows, use a different implementation to avoid cross-compilation issues
[target.'cfg(not(windows))'.dependencies]
ffmpeg-next = "8.0"

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation", 
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "implement"
] }
widestring = "1.0"
mp4 = "0.14.0"  # Pure Rust MP4 library for Windows video processing
# virtualcam-rs = { git = "https://github.com/itisl2220/virtualcam-rs" }  # TODO: Re-enable when API is documented
# For Windows builds, we'll use a simpler implementation without FFmpeg
# This avoids cross-compilation issues with native libraries

# Platform-specific dependencies for virtual camera
[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"


# Release tuning. Cargo's defaults (lto = false, codegen-units = 16) leave the
# per-frame virtual-camera code slower than it needs to be; whole-program LTO and a
# single codegen unit let the frame paths inline across module boundaries.
# Note: deliberately no rustflags in .cargo/config.toml — they conflict with cargo-xwin
# on the MSVC cross-build. Cargo *profile* keys are a different mechanism and are
# honoured identically under cargo-xwin, so `strip` here is safe.
#
# No panic = "abort": the frame paths carry `unwrap()`s (e.g. `child.stdout.take()`),
# and today a panic in a spawned task unwinds into its JoinHandle and leaves the app
# running with a broken preview. Aborting would turn each of those into a hard crash.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
