# Options applied when v4l2loopback is loaded for the CamLooper virtual camera.
# exclusive_caps=1 makes the loopback device advertise itself as a capture-only
# device, which Chrome/Chromium, Zoom and Firefox require before they will list it.
# card_label sets the friendly name shown in those apps' camera pickers.
options v4l2loopback exclusive_caps=1 card_label="CamLooper Virtual Camera"
