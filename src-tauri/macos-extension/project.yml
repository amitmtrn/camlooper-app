# XcodeGen spec for the CamLooper Camera Extension.
#   brew install xcodegen
#   DEVELOPMENT_TEAM=<your 10-char Team ID> ./dev-install.sh
# DEVELOPMENT_TEAM is read from the environment so no team is baked into the repo.
name: CameraExtension
options:
  bundleIdPrefix: com.camlooper.app
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: CameraExtension
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camlooper.app.CameraExtension
        # A system extension's bundle is named after its bundle id.
        PRODUCT_NAME: com.camlooper.app.CameraExtension
        INFOPLIST_FILE: CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
  # Never shipped: lets Xcode provision a profile for the Tauri app's bundle id.
  SigningHost:
    type: application
    platform: macOS
    sources:
      - path: SigningHost
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camlooper.app
        PRODUCT_NAME: SigningHost
        INFOPLIST_FILE: SigningHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: SigningHost/SigningHost.entitlements
        GENERATE_INFOPLIST_FILE: NO
schemes:
  # Builds both targets for "My Mac". dev-install.sh uses a scheme + destination rather
  # than bare targets so xcodebuild knows which device to register with the team.
  DevInstall:
    build:
      targets:
        CameraExtension: all
        SigningHost: all
